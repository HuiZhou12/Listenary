name: Build Windows release

# 手动触发：Actions 页面 → Build Windows release → Run workflow。
#   version：要打包的版本号（留空 = 读 pubspec.yaml 里的版本）
#   tag    ：要附加产物的 Release tag（例如 v3.1.5，draft 也可以）；**留空则只上传 artifacts，不附加**
#
# 产物：便携 zip + Inno Setup 安装器（+ sha256），始终上传为 workflow artifacts；
# 并且**只**在填了 tag 且该 Release 已存在时把产物附加上去 —— 不会自动创建 Release。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 3.1.5；留空则用 pubspec.yaml 中的版本）'
        required: false
        default: ''
      tag:
        description: '要附加产物的 Release tag，如 v3.1.5（draft 亦可）；留空 = 只上传 artifacts'
        required: false
        default: ''

permissions:
  contents: write # 仅用于把产物附加到已存在的 Release

concurrency:
  group: build-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
            if (-not $match) { throw 'Cannot read version from pubspec.yaml' }
            $version = $match.Matches[0].Groups[1].Value.Split('+')[0].Trim()
          }
          $tag = "${{ inputs.tag }}".Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host 'tag 未填写：本次只上传 artifacts，不附加到 Release。'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version=$version tag=$tag"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup and the Chinese translation
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after install.' }
          Write-Host "ISCC: $iscc ($((Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion))"

          # 官方 Inno Setup 不含中文：.iss 用 compiler:Languages\ChineseSimplified.isl，
          # 这里把仓库里自带的那份拷进编译器的 Languages 目录（本机与 CI 用同一份翻译）。
          $islSource = Join-Path $PWD 'installer\languages\ChineseSimplified.isl'
          if (-not (Test-Path -LiteralPath $islSource)) { throw "Missing vendored translation: $islSource" }
          $languagesDir = Join-Path (Split-Path -Parent $iscc) 'Languages'
          New-Item -ItemType Directory -Force -Path $languagesDir | Out-Null
          Copy-Item -LiteralPath $islSource -Destination (Join-Path $languagesDir 'ChineseSimplified.isl') -Force
          if (-not (Test-Path -LiteralPath (Join-Path $languagesDir 'ChineseSimplified.isl'))) {
            throw 'Failed to install ChineseSimplified.isl into the Inno Setup Languages directory.'
          }
          Write-Host "Installed ChineseSimplified.isl into: $languagesDir"

      # 本机曾遇到 cc-rs 归档 ring 时 lib.exe 报 LNK1104；把 AR 指向 llvm-ar 可绕过。
      # 这一步装不到 LLVM 也不影响构建（后续步骤会退化为默认归档器）。
      - name: Install LLVM (archiver workaround)
        continue-on-error: true
        shell: pwsh
        run: choco install llvm --no-progress -y

      - name: Point AR at llvm-ar when available
        shell: pwsh
        run: |
          $llvmAr = 'C:\Program Files\LLVM\bin\llvm-ar.exe'
          if (Test-Path -LiteralPath $llvmAr) {
            "AR=$llvmAr" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "AR=$llvmAr"
          } else {
            Write-Host 'llvm-ar not found; keeping the default archiver.'
          }

      - name: Flutter / Dart versions
        shell: pwsh
        run: |
          flutter --version
          dart --version

      - name: Build portable package (compile + zip)
        shell: pwsh
        run: .\build_windows.ps1 -Version "${{ steps.version.outputs.version }}" -Mode 2 -NonInteractive

      - name: Build installer (reuse the release build)
        shell: pwsh
        run: .\build_windows.ps1 -Version "${{ steps.version.outputs.version }}" -Mode 5 -NonInteractive

      - name: Upload build artifacts
        # 即使后面的步骤失败，也把已经打出来的产物传上来（例如安装器失败但便携包是好的）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Listenary_${{ steps.version.outputs.version }}_windows
          if-no-files-found: warn
          retention-days: 14
          path: |
            output/Listenary_${{ steps.version.outputs.version }}_release_portable.zip
            output/Listenary_${{ steps.version.outputs.version }}_release_installer.exe
            output/Listenary_${{ steps.version.outputs.version }}_release_installer.exe.sha256

      - name: Attach assets to the existing Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $repo = "${{ github.repository }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host 'tag 为空：跳过附加，产物请从本次 run 的 Artifacts 下载。'
            exit 0
          }
          $candidates = @(
            "output/Listenary_${version}_release_portable.zip",
            "output/Listenary_${version}_release_installer.exe",
            "output/Listenary_${version}_release_installer.exe.sha256"
          )
          $files = $candidates | Where-Object { Test-Path -LiteralPath $_ }
          if ($files.Count -eq 0) { throw 'No build outputs found to upload.' }

          # 按 tag 在 Release 列表里找：列表接口对 contents:write 的令牌会包含 draft，
          # 因此"刚建好、tag 还没真正落到 git 上"的 draft 也能匹配。查不到就只留 artifacts。
          $json = gh api "repos/$repo/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to list releases.' }
          $releases = ($json | Out-String) | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tag_name -eq $tag } | Select-Object -First 1
          if ($null -eq $release) {
            Write-Host "::warning::没有找到 tag=$tag 的 Release（含 draft）。已跳过附加；本 workflow 不会自动创建 Release。产物请从本次 run 的 Artifacts 下载。"
            exit 0
          }
          Write-Host ("Release: tag={0} draft={1} id={2}" -f $release.tag_name, $release.draft, $release.id)

          # 同名资产先删掉，实现 --clobber 效果（重复跑不会堆积）
          $names = $files | ForEach-Object { Split-Path -Leaf $_ }
          foreach ($asset in $release.assets) {
            if ($names -contains $asset.name) {
              gh api --method DELETE "repos/$repo/releases/assets/$($asset.id)" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Failed to delete existing asset $($asset.name)" }
              Write-Host "removed old asset: $($asset.name)"
            }
          }
          foreach ($file in $files) {
            $name = Split-Path -Leaf $file
            gh api --method POST -H "Content-Type: application/octet-stream" --input $file "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$name" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $name" }
            Write-Host "uploaded: $name"
          }
